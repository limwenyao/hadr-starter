# CI: run the test suite + typecheck against a real Postgres (ADR 0011).
# DB integration tests (writer/reader/persist) need a live database; a service
# container provides one. Migrations are applied from the committed drizzle/ SQL.
name: Test

on:
  push:
    branches: ["**"]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: hadr
          POSTGRES_DB: hadr
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:hadr@localhost:5432/hadr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx drizzle-kit migrate   # apply committed migrations (drizzle/)
      - run: npm test
      - run: npm run typecheck
