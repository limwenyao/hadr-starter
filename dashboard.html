<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HADR Monitor — Situation Report</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #0a1628; --surface: #0f2137; --panel: rgba(13, 27, 48, 0.92);
    --border: #1e3a5c; --text: #dbe7f3; --muted: #7d95b5; --accent: #38bdf8;
    --critical: #ef4444; --high: #f59e0b; --moderate: #eab308;
    --updated: #10b981;
    --fresh: #22c55e; --recent: #fde047;
    --rail-w: 56px; --panel-w: 380px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
  }
  #map { position: absolute; inset: 0 var(--rail-w) 0 0; background: var(--bg); }

  /* --- map fallback banner (no WebGL / library failed) — dismissible --- */
  #fallback-banner {
    position: absolute; left: 1rem; right: calc(var(--rail-w) + 1rem); bottom: 1rem;
    z-index: 40; display: flex; align-items: center; gap: 0.6rem;
    background: var(--surface); border: 1px solid var(--high); border-radius: 10px;
    padding: 0.6rem 0.9rem; font-size: 0.82rem; color: var(--text);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }
  #fallback-banner[hidden] { display: none; }
  #fallback-reason { color: var(--muted); font-size: 0.74rem; }
  #banner-close {
    margin-left: auto; background: transparent; border: none; color: var(--muted);
    font-size: 1.1rem; cursor: pointer; line-height: 1; padding: 0 0.2rem;
  }
  #banner-close:hover { color: var(--text); }

  /* --- icon rail --- */
  #rail {
    position: absolute; top: 0; right: 0; bottom: 0; width: var(--rail-w);
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center;
    padding: 0.75rem 0; gap: 0.75rem; z-index: 30;
  }
  #rail .mark {
    width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 0.7rem; letter-spacing: 0.03em;
    color: #06121f; background: var(--accent); user-select: none;
  }
  #rail button {
    position: relative; width: 38px; height: 38px; border-radius: 9px;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    font-size: 1.05rem; cursor: pointer; transition: color .15s, border-color .15s;
  }
  #rail button:hover { color: var(--text); border-color: var(--accent); }
  #rail #btn-status { color: var(--high); }
  #count-badge {
    position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px;
    border-radius: 9px; background: var(--accent); color: #06121f;
    font-size: 0.68rem; font-weight: 700; line-height: 18px; padding: 0 4px;
  }

  /* --- slide-out event list panel --- */
  #panel {
    position: absolute; top: 0; right: var(--rail-w); bottom: 0; width: var(--panel-w);
    max-width: calc(100vw - var(--rail-w)); background: var(--panel);
    backdrop-filter: blur(6px); border-left: 1px solid var(--border);
    transform: translateX(110%); transition: transform 0.22s ease; z-index: 20;
    display: flex; flex-direction: column;
  }
  body.panel-open #panel { transform: translateX(0); }
  #panel header { padding: 1rem 1.25rem 0.5rem; border-bottom: 1px solid var(--border); }
  #panel h1 { margin: 0; font-size: 1rem; letter-spacing: 0.04em; }
  #meta { margin: 0.3rem 0 0.75rem; color: var(--muted); font-size: 0.78rem; }
  #notices { padding: 0 1.25rem; }
  #notices .notice {
    background: rgba(245, 158, 11, 0.12); border: 1px solid var(--high);
    border-radius: 8px; padding: 0.5rem 0.75rem; margin: 0.75rem 0 0;
    font-size: 0.8rem; color: var(--text);
  }
  #groups { overflow-y: auto; padding: 0.5rem 1.25rem 1.5rem; flex: 1; }
  .group-title {
    font-size: 0.78rem; letter-spacing: 0.08em; margin: 1.1rem 0 0.4rem;
    padding-bottom: 0.3rem; border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .group-title::marker { color: var(--muted); }
  .group-title:hover { border-bottom-color: var(--accent); }
  .quiet { color: var(--muted); font-style: italic; padding: 1rem 0; }
  .row {
    padding: 0.6rem 0.6rem; border-radius: 8px; border: 1px solid transparent;
    cursor: pointer; margin: 0.25rem 0;
  }
  .row:hover { background: var(--surface); border-color: var(--border); }
  .row.no-coords { cursor: default; }
  .row-title { font-size: 0.86rem; font-weight: 600; margin-top: 0.3rem; }
  .row-meta { color: var(--muted); font-size: 0.74rem; margin-top: 0.15rem; }

  /* --- chips, badges, tier colours --- */
  .chips { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .chip {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em;
    padding: 0.12rem 0.4rem; border-radius: 4px; background: var(--border);
    color: var(--text);
  }
  .chip.tier.t-CRITICAL, .group-title.t-CRITICAL { color: var(--critical); }
  .chip.tier.t-HIGH, .group-title.t-HIGH { color: var(--high); }
  .chip.tier.t-MODERATE, .group-title.t-MODERATE { color: var(--moderate); }
  .chip.tier { background: rgba(255, 255, 255, 0.06); }
  .chip.listonly { color: var(--muted); }
  .chip.new { color: var(--accent); background: rgba(56, 189, 248, 0.12); }
  .chip.updated { color: var(--updated); background: rgba(16, 185, 129, 0.12); }
  .card-updated, .row-updated { font-size: 0.72rem; margin: 0.15rem 0 0; }
  /* Colour-coded update recency (ADR 0011): green <60m, yellow <24h, orange beyond. */
  .recency-fresh { color: var(--fresh); }
  .recency-recent { color: var(--recent); }
  .recency-stale { color: var(--high); }
  /* Subtle marker for inferred (approximate) update times — never overstate freshness. */
  .approx { color: var(--muted); }
  .chg { color: var(--moderate); font-size: 0.74rem; font-style: italic; margin: 0.2rem 0 0; }
  #changes { padding: 0 1.25rem; }
  .changes-title {
    font-size: 0.78rem; letter-spacing: 0.08em; margin: 1rem 0 0.2rem;
    color: var(--muted);
  }
  .chg-notice {
    background: rgba(234, 179, 8, 0.1); border: 1px solid var(--moderate);
    border-radius: 8px; padding: 0.5rem 0.75rem; margin: 0.5rem 0 0;
    font-size: 0.8rem;
  }
  .badge {
    display: inline-block; font-size: 0.7rem; background: var(--border);
    border-radius: 4px; padding: 0.05rem 0.35rem; margin-right: 0.3rem;
  }

  /* --- map markers --- */
  .mk {
    width: 15px; height: 15px; border-radius: 50%; padding: 0; cursor: pointer;
    background: var(--mk, var(--accent)); border: 2px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 10px 3px var(--mk, var(--accent));
  }

  /* --- detail card inside the maplibre popup --- */
  .maplibregl-popup-content {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 0.9rem 1rem; box-shadow: 0 8px 30px rgba(0,0,0,.45);
    font-family: inherit;
  }
  .maplibregl-popup-tip { border-top-color: var(--surface) !important; }
  .maplibregl-popup-close-button { color: var(--muted); font-size: 1.1rem; right: 4px; }
  .card { max-width: 320px; }
  .card-title { margin: 0.45rem 0 0.2rem; font-size: 0.92rem; }
  .card-meta { color: var(--muted); font-size: 0.75rem; margin: 0 0 0.4rem; }
  .card .dup { color: var(--moderate); font-size: 0.76rem; font-style: italic; margin: 0.4rem 0 0; }
  .card .assessment { font-size: 0.82rem; margin: 0.45rem 0 0; line-height: 1.45; }
  .card .src { margin: 0.45rem 0 0; }
  .card a { color: var(--accent); }
  #impact-controls { padding: 0.5rem 1.25rem 0; }
  #impact-toggle {
    width: 100%; text-align: left; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 0.45rem 0.7rem;
    font-size: 0.8rem; cursor: pointer;
  }
  #impact-toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #impact-legend { display: flex; gap: 0.75rem; margin: 0.4rem 0 0; font-size: 0.7rem; color: var(--muted); }
  #impact-legend .key::before {
    content: ""; display: inline-block; width: 14px; height: 0; vertical-align: middle;
    margin-right: 0.3rem; border-top: 2px solid var(--muted);
  }
  #impact-legend .key.estimate::before { border-top-style: dashed; }
  .impact-caption { margin: 0.35rem 0 0; font-size: 0.68rem; color: var(--muted); font-style: italic; }
  .row .footprint, .card .footprint { color: var(--muted); font-size: 0.74rem; margin: 0.3rem 0 0; }

  /* --- data sources panel (mirrors #panel) --- */
  #sources-panel {
    position: absolute; top: 0; right: var(--rail-w); bottom: 0; width: var(--panel-w);
    max-width: calc(100vw - var(--rail-w)); background: var(--panel);
    backdrop-filter: blur(6px); border-left: 1px solid var(--border);
    transform: translateX(110%); transition: transform 0.22s ease; z-index: 20;
    display: flex; flex-direction: column;
  }
  body.sources-open #sources-panel { transform: translateX(0); }
  #sources-panel header { padding: 1rem 1.25rem 0.6rem; border-bottom: 1px solid var(--border); }
  #sources-panel h1 { margin: 0; font-size: 1rem; letter-spacing: 0.04em; }
  #sources-sub { margin: 0.3rem 0 0; color: var(--muted); font-size: 0.78rem; }
  #sources-list { overflow-y: auto; padding: 0.5rem 1.25rem 1.5rem; flex: 1; }
  #sources-panel .src { padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
  #sources-panel .src:last-child { border-bottom: none; }
  #sources-panel .src .nm { display: flex; align-items: center; font-size: 0.9rem; font-weight: 700; }
  #sources-panel .src .light {
    margin-left: auto; width: 11px; height: 11px; border-radius: 50%;
    background: var(--muted); box-shadow: 0 0 6px 1px var(--muted);
  }
  #sources-panel .src .light.recency-fresh { background: var(--fresh); box-shadow: 0 0 6px 1px var(--fresh); }
  #sources-panel .src .light.recency-recent { background: var(--recent); box-shadow: 0 0 6px 1px var(--recent); }
  #sources-panel .src .light.recency-stale { background: var(--high); box-shadow: 0 0 6px 1px var(--high); }
  #sources-panel .src .ds { color: var(--muted); font-size: 0.78rem; margin: 0.3rem 0 0.4rem; line-height: 1.4; }
  #sources-panel .src .links { font-size: 0.76rem; margin-bottom: 0.4rem; }
  #sources-panel .src .links a { color: var(--accent); text-decoration: none; }
  #sources-panel .src .links a.feed { color: var(--muted); }
  #sources-panel .src .links .sep { color: var(--border); margin: 0 0.45rem; }
  #sources-panel .src .updated { font-size: 0.76rem; }
  #sources-panel .src .failnote { font-size: 0.74rem; color: var(--muted); margin-top: 0.3rem; }
</style>
</head>

</div>

  <div id="groups"></div>
</aside>
<aside id="sources-panel" aria-label="Data sources">
  <header>
    <h1>DATA SOURCES</h1>
    <p id="sources-sub"></p>

  <div id="sources-list"></div>
</aside>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
(function () {
  "use strict";

  var vm;
  try {
    vm = JSON.parse(document.getElementById("sitrep-data").textContent);
  } catch (e) {
    return showFallback("Could not read the embedded sitrep data.");
  }

  var geometry = {};
  try {
    var geomNode = document.getElementById("sitrep-geometry");
    if (geomNode) geometry = JSON.parse(geomNode.textContent);
  } catch (e) { geometry = {}; }

  var impactMode = "hide";   // "hide" (selection-driven, default) | "show"
  var activeKey = null;      // footprint key of the selected event, or null
  var NONE_KEY = " none";

  var TIER_COLOURS = { CRITICAL: "#ef4444", HIGH: "#f59e0b", MODERATE: "#eab308" };
  var STYLE_URL = "https://tiles.openfreemap.org/styles/fiord";
  var openPopup = null;
  var map = null;

  // --- tiny DOM helpers (textContent only for data — feeds are untrusted) ---
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  var ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
  function footprintText(fp) {
    if (!fp) return null;
    var t = fp.label;
    if (typeof fp.maxMmi === "number" && isFinite(fp.maxMmi)) {
      var n = Math.max(0, Math.min(10, Math.round(fp.maxMmi)));
      t += " · reached MMI " + (ROMAN[n] || n);
    } else if (typeof fp.radiusKm === "number") {
      t += " · ~" + fp.radiusKm + " km";
    }
    if (fp.isEstimate) t += " · estimate, not an evacuation boundary";
    return t;
  }

  // Map failure (no WebGL, blocked CDN, bad payload) is announced with a
  // dismissible bottom banner — never a dead end: the events panel auto-opens
  // and carries the full brief (never fail silently).
  function showFallback(reason) {
    var banner = document.getElementById("fallback-banner");
    if (banner) {
      banner.hidden = false;
      var detail = document.getElementById("fallback-reason");
      if (detail && reason) {
        // Engine errors can be huge JSON blobs — keep the banner readable.
        var brief = String(reason);
        if (brief.length > 120) brief = brief.slice(0, 117) + "...";
        detail.textContent = "(" + brief + ")";
      }
    }
    openPanel();
  }

  function openPanel() {
    document.body.classList.add("panel-open");
    document.body.classList.remove("sources-open");
  }

  function togglePanel() {
    document.body.classList.remove("sources-open");
    document.body.classList.toggle("panel-open");
  }

  function toggleSources() {
    document.body.classList.remove("panel-open");
    document.body.classList.toggle("sources-open");
  }

  function refreshImpact() {
    if (!map || !map.getLayer || !map.getLayer("impact-fill")) return;
    var visFilter = impactMode === "show"
      ? null
      : ["==", ["get", "eventId"], activeKey || NONE_KEY];
    var polyFilter = impactMode === "show"
      ? ["==", "$type", "Polygon"]
      : ["all", ["==", "$type", "Polygon"], ["==", ["get", "eventId"], activeKey || NONE_KEY]];
    map.setFilter("impact-line", visFilter);
    map.setFilter("impact-fill", polyFilter);
  }

  // --- detail card (shared by marker click and list click) ---
  function buildCard(ev) {
    var card = el("div", "card");
    var chips = el("div", "chips");
    chips.appendChild(el("span", "chip feed", ev.feed));
    chips.appendChild(el("span", "chip tier t-" + ev.tier, ev.tier));
    if (ev.isNew) chips.appendChild(el("span", "chip new", "NEW"));
    if (ev.isUpdated) chips.appendChild(el("span", "chip updated", "UPDATED"));
    card.appendChild(chips);
    card.appendChild(el("h3", "card-title", ev.title));
    var meta = el("p", "card-meta", ev.location);
    card.appendChild(meta);
    var upd = el("p", "card-updated recency-" + ev.updatedRecency, "Updated: " + ev.sourceUpdatedAgeLabel);
    // Subtle marker for feeds whose update time we infer (never overstate freshness).
    if (ev.updateProvenance === "inferred") upd.appendChild(el("span", "approx", " (approx)"));
    card.appendChild(upd);
    if (ev.changeNote) card.appendChild(el("p", "chg", "△ " + ev.changeNote));
    if (ev.badges.length) {
      var badges = el("div", "badges");
      ev.badges.forEach(function (b) {
        badges.appendChild(el("span", "badge", b));
      });
      card.appendChild(badges);
    }
    if (ev.duplicateNote) card.appendChild(el("p", "dup", "⚠ " + ev.duplicateNote));
    if (ev.assessment) card.appendChild(el("p", "assessment", ev.assessment));
    var fpText = footprintText(ev.footprint);
    if (fpText) card.appendChild(el("p", "footprint", fpText));
    if (ev.sourceUrl) {
      var p = el("p", "src");
      var a = el("a", null, "source");
      a.href = ev.sourceUrl; // sanitized server-side: http(s) only
      a.rel = "noopener";
      a.target = "_blank";
      p.appendChild(a);
      card.appendChild(p);
    }
    return card;
  }

  function openCard(ev) {
    if (!map || !ev.coordinates) return;
    if (openPopup) openPopup.remove();
    openPopup = new maplibregl.Popup({ maxWidth: "340px", offset: 14 })
      .setLngLat([ev.coordinates.lon, ev.coordinates.lat])
      .setDOMContent(buildCard(ev))
      .addTo(map);
    // Clear the reference when the user closes the card (X / map click),
    // so we never hold a stale removed popup.
    openPopup.on("close", function () { openPopup = null; });
  }

  function flyToEvent(ev) {
    activeKey = ev.key;
    refreshImpact();
    if (!map || !ev.coordinates) return;
    map.flyTo({ center: [ev.coordinates.lon, ev.coordinates.lat], zoom: 5 });
    openCard(ev);
  }

  // --- panel: meta line, degradation notices, tier groups ---
  document.getElementById("meta").textContent =
    "Generated " + vm.generatedUtc + (vm.changesLine ? " · " + vm.changesLine : "");

  // --- data sources panel ---
  (function buildSources() {
    var sub = document.getElementById("sources-sub");
    sub.textContent = vm.dataSourcesSubtext;

    var list = document.getElementById("sources-list");
    vm.dataSources.forEach(function (s) {
      var row = el("div", "src");

      var nm = el("div", "nm", s.feed);
      nm.appendChild(el("span", "light" + (s.recency ? " recency-" + s.recency : "")));
      row.appendChild(nm);

      row.appendChild(el("div", "ds", s.description));

      var links = el("div", "links");
      if (s.homeUrl) {
        var home = el("a", null, s.homeLabel + " ↗");
        home.href = s.homeUrl; home.target = "_blank"; home.rel = "noopener noreferrer";
        links.appendChild(home);
      }
      if (s.feedUrl) {
        if (links.childNodes.length) links.appendChild(el("span", "sep", "·"));
        var feed = el("a", "feed", "feed ↗");
        feed.href = s.feedUrl; feed.target = "_blank"; feed.rel = "noopener noreferrer";
        links.appendChild(feed);
      }
      row.appendChild(links);

      var updatedText = !vm.dataSourcesStatusAvailable
        ? "Fetch status unavailable"
        : (s.updatedAgeLabel ? "Updated: " + s.updatedAgeLabel : "No successful fetch yet");
      row.appendChild(el("div", "updated" + (s.recency ? " recency-" + s.recency : ""), updatedText));

      if (s.failureNote) {
        row.appendChild(el("div", "failnote", "⚠ " + s.failureNote));
      }

      list.appendChild(row);
    });
  })();

  var badge = document.getElementById("count-badge");
  badge.textContent = String(vm.totalCount);

  var notices = document.getElementById("notices");
  if (vm.degradation.length) {
    document.getElementById("btn-status").hidden = false;
    vm.degradation.forEach(function (d) {
      notices.appendChild(
        el("p", "notice", d.feed + " feed unavailable this run — " + d.reason +
          ". Events from this feed are missing."),
      );
    });
  }

  // "Changes since yesterday" block: possibly-withdrawn notes (ADR 0009).
  var changes = document.getElementById("changes");
  if (vm.withdrawn.length) {
    changes.appendChild(el("h2", "changes-title", "Changes since yesterday"));
    vm.withdrawn.forEach(function (note) {
      changes.appendChild(el("p", "notice chg-notice", note));
    });
  }

  var groups = document.getElementById("groups");
  if (vm.totalCount === 0) {
    groups.appendChild(el("p", "quiet", "No surfaced events this run — a quiet morning."));
    openPanel();
  }
  vm.tiers.forEach(function (group) {
    // Native details/summary: each tier subsection toggles open/closed with
    // keyboard support for free. Default expanded.
    var section = el("details", "group");
    section.open = true;
    var h = el("summary", "group-title t-" + group.tier, group.tier + " (" + group.count + ")");
    section.appendChild(h);
    group.events.forEach(function (ev) {
      var row = el("div", "row" + (ev.coordinates ? "" : " no-coords"));
      var chips = el("div", "chips");
      chips.appendChild(el("span", "chip tier t-" + ev.tier, ev.tier));
      chips.appendChild(el("span", "chip feed", ev.feed));
      if (ev.isNew) chips.appendChild(el("span", "chip new", "NEW"));
      if (ev.isUpdated) chips.appendChild(el("span", "chip updated", "UPDATED"));
      if (!ev.coordinates) chips.appendChild(el("span", "chip listonly", "list-only"));
      row.appendChild(chips);
      row.appendChild(el("div", "row-title", ev.title));
      row.appendChild(el("div", "row-meta", ev.location));
      var rowUpd = el("div", "row-updated recency-" + ev.updatedRecency, "Updated: " + ev.sourceUpdatedAgeLabel);
      if (ev.updateProvenance === "inferred") rowUpd.appendChild(el("span", "approx", " (approx)"));
      row.appendChild(rowUpd);
      if (ev.changeNote) row.appendChild(el("div", "chg", "△ " + ev.changeNote));
      var rowFp = footprintText(ev.footprint);
      if (rowFp) row.appendChild(el("div", "footprint", rowFp));
      if (ev.coordinates) {
        row.addEventListener("click", function () { flyToEvent(ev); });
      }
      section.appendChild(row);
    });
    groups.appendChild(section);
  });

  // --- rail buttons + banner dismiss ---
  document.getElementById("btn-events").addEventListener("click", togglePanel);
  document.getElementById("btn-status").addEventListener("click", openPanel);
  document.getElementById("btn-sources").addEventListener("click", toggleSources);
  document.getElementById("banner-close").addEventListener("click", function () {
    document.getElementById("fallback-banner").hidden = true;
  });

  var impactBtn = document.getElementById("impact-toggle");
  if (impactBtn) {
    impactBtn.addEventListener("click", function () {
      impactMode = impactMode === "show" ? "hide" : "show";
      var on = impactMode === "show";
      impactBtn.setAttribute("aria-pressed", on ? "true" : "false");
      impactBtn.textContent = "Impact areas: " + (on ? "on" : "off");
      refreshImpact();
    });
  }

  // --- map ---
  var withCoords = [];
  vm.tiers.forEach(function (g) {
    g.events.forEach(function (ev) { if (ev.coordinates) withCoords.push(ev); });
  });

  try {
    if (typeof maplibregl === "undefined") throw new Error("map library failed to load");
    map = new maplibregl.Map({
      container: "map",
      style: STYLE_URL,
      center: [20, 12],
      zoom: 1.4,
    });
    map.addControl(new maplibregl.NavigationControl(), "bottom-left");

    withCoords.forEach(function (ev) {
      var dot = el("button", "mk t-" + ev.tier);
      dot.title = ev.title;
      dot.style.setProperty("--mk", TIER_COLOURS[ev.tier] || "#38bdf8");
      dot.addEventListener("click", function (e) {
        e.stopPropagation();
        activeKey = ev.key;
        refreshImpact();
        openCard(ev);
      });
      new maplibregl.Marker({ element: dot })
        .setLngLat([ev.coordinates.lon, ev.coordinates.lat])
        .addTo(map);
    });

    // Position the view only once the style has loaded — calling fitBounds
    // synchronously after construction can be dropped on slow style loads,
    // leaving every marker off-screen.
    map.on("load", function () {
      var allFeatures = [];
      Object.keys(geometry).forEach(function (k) {
        var fc = geometry[k];
        if (fc && fc.features) allFeatures = allFeatures.concat(fc.features);
      });
      map.addSource("impact", { type: "geojson", data: { type: "FeatureCollection", features: allFeatures } });
      map.addLayer({
        id: "impact-fill", type: "fill", source: "impact",
        filter: ["==", "$type", "Polygon"],
        paint: { "fill-color": ["get", "color"], "fill-opacity": ["case", ["get", "isEstimate"], 0.08, 0.18] },
      });
      map.addLayer({
        id: "impact-line", type: "line", source: "impact",
        paint: {
          "line-color": ["get", "color"],
          "line-width": 2,
          "line-dasharray": ["case", ["get", "isEstimate"], ["literal", [2, 2]], ["literal", [1, 0]]],
        },
      });
      refreshImpact();

      if (withCoords.length === 1) {
        map.setCenter([withCoords[0].coordinates.lon, withCoords[0].coordinates.lat]);
        map.setZoom(4);
      } else if (withCoords.length > 1) {
        var b = new maplibregl.LngLatBounds();
        withCoords.forEach(function (ev) {
          b.extend([ev.coordinates.lon, ev.coordinates.lat]);
        });
        map.fitBounds(b, { padding: 80, maxZoom: 6 });
      }
    });
  } catch (e) {
    showFallback(String(e && e.message ? e.message : e));
  }
})();
</script>
</body>
</html>
